<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected — Postdesk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f7f8fa; --surface: #fff; --ink: #16181d; --ink-2: #5b6170;
    --ink-3: #8b909d; --lijn: #e3e6ec; --accent: #5b5bd6; --fout: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --surface: #181b20; --ink: #eef0f4; --ink-2: #a3aab8;
      --ink-3: #757c8a; --lijn: #272b32; --fout: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: var(--ink-2); }
  .code {
    background: var(--surface); border: 1px solid var(--lijn);
    border-radius: 10px; padding: 16px; margin: 20px 0;
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    font-size: 13px; word-break: break-all; color: var(--ink);
  }
  button {
    padding: 11px 20px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  .fout { color: var(--fout); }
  footer {
    margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--lijn);
    font-size: 14px;
  }
  footer a { color: var(--ink-2); margin-right: 18px; }
</style>
</head>
<body>
<main>

  <div id="inhoud"></div>

  <footer>
    <a href="index.html">Home</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </footer>

</main>

<script>
// Deze pagina heeft geen server nodig: de code staat in de adresbalk en wordt
// hier alleen getoond zodat je hem kunt kopieren naar auth.py.
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const fout = params.get('error') || params.get('error_description');
const vak = document.getElementById('inhoud');

if (code) {
  vak.innerHTML = `
    <h1>Account connected</h1>
    <p>Kopieer deze code en plak hem in het venster waar <strong>auth.py</strong> op je code wacht.</p>
    <div class="code" id="code">${code.replace(/[<>&]/g, '')}</div>
    <button id="kopieer">Kopieer code</button>`;

  document.getElementById('kopieer').onclick = async (e) => {
    try {
      await navigator.clipboard.writeText(document.getElementById('code').textContent.trim());
      e.target.textContent = 'Gekopieerd';
    } catch {
      e.target.textContent = 'Kopieer handmatig';
    }
  };

} else if (fout) {
  vak.innerHTML = `
    <h1>Connection failed</h1>
    <p>Het platform gaf deze melding terug:</p>
    <div class="code fout">${fout.replace(/[<>&]/g, '')}</div>
    <p>Meestal betekent dit dat de redirect-URI in je developer-app niet exact
    overeenkomt met het adres van deze pagina. Ook een ontbrekende schuine streep
    op het eind telt als verschil.</p>`;

} else {
  vak.innerHTML = `
    <h1>Nothing to show</h1>
    <p>Deze pagina vangt de koppeling op nadat je bij TikTok, Google of Meta hebt
    ingelogd. Kom je hier zonder in te loggen, dan valt er niks te doen.</p>`;
}
</script>

</body>
</html>
